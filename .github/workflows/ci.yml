name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # E/F only: real bugs (undefined names, unused imports, syntax) — not
      # a style opinion. Deliberate choices like catching bare Exception in
      # cli.py/edgar.py ("one bad filing never stops the run") are not bugs.
      - run: ruff check --select=E4,E7,E9,F --line-length=110 .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: python tests/test_smoke.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit pip-audit
      - name: bandit (static analysis for common Python vuln patterns)
        run: bandit -r pipeline -ll
      - name: pip-audit (known CVEs in pinned dependencies)
        run: pip-audit -r requirements.txt
